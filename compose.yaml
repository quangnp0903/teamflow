services:
  db:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_USER: teamflow
      POSTGRES_PASSWORD: teamflow_dev
      POSTGRES_DB: teamflow
    ports:
      - "5433:5432"
    volumes:
      - teamflow_postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U teamflow -d teamflow"]
      interval: 5s
      timeout: 5s
      retries: 10
      
  db-test:
    profiles: ["test"]
    image: postgres:18.6-alpine
    environment:
      POSTGRES_USER: teamflow
      POSTGRES_PASSWORD: teamflow_test
      POSTGRES_DB: teamflow_test
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U teamflow -d teamflow_test"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  teamflow_postgres_data: